name: Update status.json
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    concurrency: update-status-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch project list
        run: |
          node .github/scripts/fetch_projects.js fudefu > projects.json

      - name: Run fetch and update status
        run: |
          # fetch_data.js は projects.json を参照するように作っておく（フォールバック付き）
          node .github/scripts/fetch_data.js

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update status.json"
          file_pattern: status.json
