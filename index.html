<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="ICON.png">
<title>Scratch Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F5;
    --panel:#FFFFFF;
    --ink:#1C2B3A;
    --ink-soft:#5B6672;
    --ink-faint:#93A0AC;
    --border:#D7DDE3;
    --accent:#2F8F6E;
    --accent-dark:#22694F;
    --line-views:#2F6FA8;
    --line-loves:#C25B4A;
    --line-favs:#B4881F;
    --serif:'Source Serif 4', Georgia, serif;
    --mono:'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--mono);
    color:var(--ink);
    background:
      linear-gradient(var(--paper) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper) 1px, transparent 1px),
      #E4E9EE;
    background-size:100% 100%, 100% 100%;
    background-color:var(--paper);
    padding:28px 16px 60px;
  }
  .page{
    max-width:620px;
    margin:0 auto;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    flex-wrap:wrap;
    padding-bottom:14px;
    border-bottom:2px solid var(--ink);
  }
  header::after{content:none;}
  .wordmark{
    font-family:var(--serif);
    font-weight:600;
    font-size:28px;
    letter-spacing:0.2px;
    margin:0;
  }
  .tagline{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .updated{
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
  .updated strong{color:var(--ink);font-weight:500;}
  .rule-thin{border:none;border-top:1px solid var(--border);margin:0 0 22px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  input, select{
    width:100%;
    font-family:var(--mono);
    font-size:14px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:3px;
    padding:9px 10px;
  }
  input:focus, select:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  #searchResults{
    margin-top:6px;
    border:1px solid var(--border);
    border-radius:3px;
    background:var(--panel);
    max-height:190px;
    overflow-y:auto;
    display:none;
  }
  .search-result{
    padding:8px 10px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .search-result:last-child{border-bottom:none;}
  .search-result:hover{background:#EAF3EF;}

  .error-banner{
    display:none;
    font-size:12px;
    color:var(--line-loves);
    border:1px solid var(--line-loves);
    background:#FBEEEC;
    border-radius:3px;
    padding:8px 10px;
    margin-bottom:14px;
  }

  .project-heading{margin:28px 0 4px;}
  .project-name{
    font-family:var(--serif);
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .project-id{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:3px;
  }

  .stats-row{
    display:flex;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:3px;
    overflow:hidden;
    margin:16px 0 18px;
  }
  .stat-cell{
    flex:1;
    background:var(--panel);
    padding:12px 10px;
    text-align:left;
  }
  .stat-value{
    font-size:22px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
  }
  .stat-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .stat-views .stat-value{color:var(--line-views);}
  .stat-loves .stat-value{color:var(--line-loves);}
  .stat-favs .stat-value{color:var(--line-favs);}

  .chart-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:3px;
    padding:14px 14px 6px;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:32px 32px;
    background-position:-1px -1px;
  }
  .graph-container{position:relative;width:100%;height:230px;}
  svg{width:100%;height:100%;overflow:visible;touch-action:pan-y;}
  .chart-hover-tip{
    position:absolute;
    pointer-events:none;
    top:0;
    left:0;
    transform:translate(-50%,-100%);
    background:var(--ink);
    color:#F5F7F9;
    font-family:var(--mono);
    font-size:11px;
    line-height:1.5;
    padding:8px 10px;
    border-radius:3px;
    white-space:nowrap;
    opacity:0;
    transition:opacity 100ms ease;
    z-index:4;
  }
  .chart-hover-tip.visible{opacity:1;}
  .chart-hover-tip .tip-date{color:#C7D0D8;margin-bottom:3px;}
  .chart-hover-tip .tip-row{display:flex;align-items:center;gap:6px;}
  .chart-hover-tip .tip-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .empty-chart{
    font-size:12px;
    color:var(--ink-faint);
    padding:40px 0;
    text-align:center;
  }

  .legend{
    display:flex;
    gap:18px;
    justify-content:flex-start;
    margin:12px 2px 0;
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot-views{background:var(--line-views);}
  .dot-loves{background:var(--line-loves);}
  .dot-favs{background:var(--line-favs);}

  .actions{margin-top:26px;display:flex;justify-content:flex-end;}
  .btn-outline{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--ink);
    border-radius:3px;
    padding:9px 16px;
    cursor:pointer;
  }
  .btn-outline:hover{background:var(--ink);color:var(--panel);}

  footer{
    margin-top:34px;
    font-size:11px;
    color:var(--ink-faint);
    border-top:1px solid var(--border);
    padding-top:12px;
  }

  @media (max-width:420px){
    .wordmark{font-size:24px;}
    .stats-row{flex-direction:column;}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <p class="wordmark">Scratch Tracker</p>
        <p class="tagline">作品の閲覧数・ハート・星の推移を記録</p>
      </div>
      <div class="updated" id="updatedLabel">最終更新: —</div>
    </header>
    <hr class="rule-thin">

    <div class="error-banner" id="errorBanner">status.json の読み込みに失敗しました。時間を置いて再度お試しください。</div>

    <div class="field">
      <label for="searchInput">作品を検索</label>
      <input type="text" id="searchInput" placeholder="作品名またはIDで検索" oninput="searchProjects()">
      <div id="searchResults"></div>
    </div>

    <div class="field">
      <label for="projectSelect">登録されている作品から選ぶ</label>
      <select id="projectSelect" onchange="changeProject()"></select>
    </div>

    <div class="project-heading">
      <h2 class="project-name" id="currentTitle">読み込み中…</h2>
      <div class="project-id" id="currentId"></div>
    </div>

    <div class="stats-row" id="statsRow">
      <div class="stat-cell stat-views">
        <div class="stat-value" id="statViews">—</div>
        <div class="stat-label">閲覧数</div>
      </div>
      <div class="stat-cell stat-loves">
        <div class="stat-value" id="statLoves">—</div>
        <div class="stat-label">ハート</div>
      </div>
      <div class="stat-cell stat-favs">
        <div class="stat-value" id="statFavs">—</div>
        <div class="stat-label">星の数</div>
      </div>
    </div>

    <div class="chart-panel">
      <div class="graph-container" id="graphContainer">
        <svg id="lineChart" role="img" aria-label="閲覧数・ハート・星の推移グラフ。ポイントにカーソルを合わせると日付ごとの数値が表示されます"></svg>
        <div class="chart-hover-tip" id="chartTip"></div>
      </div>
    </div>
    <div class="legend">
      <span><i class="dot dot-views"></i>閲覧数</span>
      <span><i class="dot dot-loves"></i>ハート</span>
      <span><i class="dot dot-favs"></i>星の数</span>
    </div>

    <div class="actions">
      <button class="btn-outline" onclick="exportTxt()">txt に書き出す</button>
    </div>

    <footer>
      データは毎日自動更新されます（GitHub Actions / status.json）。
    </footer>
  </div>

<script>
  const DEFAULT_PROJECTS = [{ id: "1207770778", name: "3Dっぽいプラットフォーマー" }];
  let currentProjectId = "1207770778";
  let STATUS_DATA = { update: null, projects: [] };

  async function loadStatusJson() {
    try {
      const res = await fetch('./status.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      STATUS_DATA = {
        update: data.update || null,
        projects: Array.isArray(data.projects) ? data.projects : []
      };
      document.getElementById('errorBanner').style.display = 'none';
    } catch (e) {
      console.error('status.json load error:', e);
      STATUS_DATA = { update: null, projects: [] };
      document.getElementById('errorBanner').style.display = 'block';
    }
  }

  function formatUpdated(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  window.onload = async function () {
    await loadStatusJson();
    document.getElementById('updatedLabel').innerHTML = `最終更新: <strong>${formatUpdated(STATUS_DATA.update)}</strong>`;

    initProjectList();

    const select = document.getElementById('projectSelect');
    const savedLastId = localStorage.getItem('scratch_last_selected_id');
    if (savedLastId && Array.from(select.options).some(opt => opt.value === String(savedLastId))) {
      currentProjectId = String(savedLastId);
      select.value = currentProjectId;
    } else if (select.options.length > 0) {
      currentProjectId = select.options[0].value;
    }

    changeProject();
  };

  function initProjectList() {
    let plist = Array.isArray(STATUS_DATA.projects) ? STATUS_DATA.projects.slice() : [];
    if (!plist || plist.length === 0) plist = DEFAULT_PROJECTS.slice();

    const select = document.getElementById('projectSelect');
    select.innerHTML = '';
    plist.forEach(p => {
      if (p && p.id) {
        const opt = document.createElement('option');
        opt.value = String(p.id).trim();
        opt.innerText = `${p.name || ''} (${p.id})`;
        select.appendChild(opt);
      }
    });
  }

  function searchProjects() {
    const query = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    const resultsDiv = document.getElementById('searchResults');
    if (!query) { resultsDiv.style.display = 'none'; return; }

    const plist = Array.isArray(STATUS_DATA.projects) ? STATUS_DATA.projects : [];
    const matched = plist.filter(p => (p.name || '').toLowerCase().includes(query) || String(p.id).includes(query));

    if (matched.length === 0) { resultsDiv.style.display = 'none'; return; }

    resultsDiv.innerHTML = '';
    matched.forEach(p => {
      const div = document.createElement('div');
      div.className = 'search-result';
      div.textContent = `${p.name || ''} (${p.id})`;
      div.onclick = () => {
        currentProjectId = String(p.id);
        localStorage.setItem('scratch_last_selected_id', currentProjectId);
        const select = document.getElementById('projectSelect');
        select.value = currentProjectId;
        document.getElementById('searchInput').value = '';
        resultsDiv.style.display = 'none';
        changeProject();
      };
      resultsDiv.appendChild(div);
    });
    resultsDiv.style.display = 'block';
  }

  function changeProject() {
    const select = document.getElementById('projectSelect');
    if (select && select.options.length > 0) {
      currentProjectId = select.value;
      localStorage.setItem('scratch_last_selected_id', currentProjectId);
      const opt = select.options[select.selectedIndex];
      const rawText = opt.text;
      const lastIdx = rawText.lastIndexOf(' (');
      document.getElementById('currentTitle').innerText = lastIdx !== -1 ? rawText.substring(0, lastIdx) : rawText;
      document.getElementById('currentId').innerText = `ID: ${currentProjectId}`;
    } else {
      document.getElementById('currentTitle').innerText = '登録されている作品がありません';
      document.getElementById('currentId').innerText = '';
    }
    updateStats();
    drawChart();
  }

  function currentProjectData() {
    const project = STATUS_DATA.projects.find(p => String(p.id) === String(currentProjectId));
    return (project && Array.isArray(project.data)) ? project.data : [];
  }

  function updateStats() {
    const data = currentProjectData();
    const last = data[data.length - 1];
    document.getElementById('statViews').textContent = last ? last.views : '—';
    document.getElementById('statLoves').textContent = last ? last.loves : '—';
    document.getElementById('statFavs').textContent = last ? last.favorites : '—';
  }

  function drawChart() {
    const savedData = currentProjectData();
    const svg = document.getElementById('lineChart');
    if (!svg) return;
    svg.innerHTML = '';

    if (savedData.length < 1) {
      const container = svg.parentElement;
      if (!container.querySelector('.empty-chart')) {
        const msg = document.createElement('div');
        msg.className = 'empty-chart';
        msg.textContent = '記録がまだありません';
        container.appendChild(msg);
      }
      return;
    }
    const existingMsg = svg.parentElement.querySelector('.empty-chart');
    if (existingMsg) existingMsg.remove();

    const width = svg.clientWidth || 600;
    const height = svg.clientHeight || 230;
    const padding = 20;

    const allViews = savedData.map(d => d.views);
    const maxViews = Math.max(...allViews) || 10;
    const minViews = Math.min(...allViews) || 0;
    const viewRange = (maxViews - minViews) === 0 ? 10 : (maxViews - minViews);

    const allLoves = savedData.map(d => d.loves);
    const maxLoves = Math.max(...allLoves) || 10;
    const minLoves = Math.min(...allLoves) || 0;
    const loveRange = (maxLoves - minLoves) === 0 ? 10 : (maxLoves - minLoves);

    const allFavs = savedData.map(d => d.favorites);
    const maxFavs = Math.max(...allFavs) || 10;
    const minFavs = Math.min(...allFavs) || 0;
    const favRange = (maxFavs - minFavs) === 0 ? 10 : (maxFavs - minFavs);

    const totalPoints = savedData.length;
    const xStep = totalPoints > 1 ? (width - padding * 2) / (totalPoints - 1) : (width - padding * 2);

    let viewPoints = [], lovePoints = [], favPoints = [];
    const pointsData = [];
    savedData.forEach((item, index) => {
      const x = totalPoints > 1 ? padding + index * xStep : width / 2;
      const yView = height - padding - ((item.views - minViews) / viewRange) * (height - padding * 2);
      const yLove = height - padding - ((item.loves - minLoves) / loveRange) * (height - padding * 2);
      const yFav = height - padding - ((item.favorites - minFavs) / favRange) * (height - padding * 2);
      viewPoints.push(`${x},${yView}`);
      lovePoints.push(`${x},${yLove}`);
      favPoints.push(`${x},${yFav}`);
      pointsData.push({ x, yView, yLove, yFav, item });
      createSvgCircle(svg, x, yView, '#2F6FA8', 4, 'pt-view');
      createSvgCircle(svg, x, yLove, '#C25B4A', 4, 'pt-love');
      createSvgCircle(svg, x, yFav, '#B4881F', 4, 'pt-fav');
    });
    if (totalPoints > 1) {
      createSvgLine(svg, viewPoints.join(' '), '#2F6FA8', 3);
      createSvgLine(svg, lovePoints.join(' '), '#C25B4A', 2);
      createSvgLine(svg, favPoints.join(' '), '#B4881F', 2);
      createSvgText(svg, pointsData[0].x, height + 15, savedData[0].date || '', '#93A0AC');
      createSvgText(svg, pointsData[totalPoints - 1].x, height + 15, savedData[totalPoints - 1].date || '', '#93A0AC');
    }

    const guideLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    guideLine.setAttribute('y1', padding - 4);
    guideLine.setAttribute('y2', height - padding + 4);
    guideLine.setAttribute('stroke', '#93A0AC');
    guideLine.setAttribute('stroke-width', '1');
    guideLine.setAttribute('stroke-dasharray', '3,3');
    guideLine.setAttribute('opacity', '0');
    svg.appendChild(guideLine);

    const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    hitArea.setAttribute('x', '0');
    hitArea.setAttribute('y', '0');
    hitArea.setAttribute('width', width);
    hitArea.setAttribute('height', height);
    hitArea.setAttribute('fill', 'transparent');
    svg.appendChild(hitArea);

    const tip = document.getElementById('chartTip');
    const container = document.getElementById('graphContainer');
    const dotColors = { views: '#2F6FA8', loves: '#C25B4A', favorites: '#B4881F' };
    const dotLabels = { views: '閲覧数', loves: 'ハート', favorites: '星の数' };

    function showTipAt(index) {
      const p = pointsData[index];
      if (!p) return;
      guideLine.setAttribute('x1', p.x);
      guideLine.setAttribute('x2', p.x);
      guideLine.setAttribute('opacity', '1');
      ['pt-view', 'pt-love', 'pt-fav'].forEach((cls, i) => {
        svg.querySelectorAll('.' + cls).forEach((c, ci) => {
          c.setAttribute('r', ci === index ? '6' : '4');
        });
      });
      tip.innerHTML =
        `<div class="tip-date">${p.item.date || ''}</div>` +
        ['views', 'loves', 'favorites'].map(key =>
          `<div class="tip-row"><i class="tip-dot" style="background:${dotColors[key]}"></i>${dotLabels[key]}: ${p.item[key]}</div>`
        ).join('');
      const left = (p.x / width) * container.clientWidth;
      const top = Math.min(p.yView, p.yLove, p.yFav);
      tip.style.left = left + 'px';
      tip.style.top = Math.max(top - 10, 0) + 'px';
      tip.classList.add('visible');
    }

    function hideTip() {
      guideLine.setAttribute('opacity', '0');
      ['pt-view', 'pt-love', 'pt-fav'].forEach(cls => {
        svg.querySelectorAll('.' + cls).forEach(c => c.setAttribute('r', '4'));
      });
      tip.classList.remove('visible');
    }

    hitArea.addEventListener('pointermove', (e) => {
      const rect = svg.getBoundingClientRect();
      const mouseX = ((e.clientX - rect.left) / rect.width) * width;
      let index = totalPoints > 1 ? Math.round((mouseX - padding) / xStep) : 0;
      index = Math.max(0, Math.min(totalPoints - 1, index));
      showTipAt(index);
    });
    hitArea.addEventListener('pointerleave', hideTip);
  }

  function createSvgLine(svg, points, color, width) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', points); line.setAttribute('fill', 'none');
    line.setAttribute('stroke', color); line.setAttribute('stroke-width', width);
    line.setAttribute('stroke-linecap', 'round'); line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(line);
  }

  function createSvgCircle(svg, cx, cy, color, r, className) {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r || '4');
    circle.setAttribute('fill', color);
    if (className) circle.setAttribute('class', className);
    svg.appendChild(circle);
  }

  function createSvgText(svg, x, y, textContent, color) {
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x); text.setAttribute('y', y);
    text.setAttribute('font-size', '10'); text.setAttribute('font-family', 'IBM Plex Mono, monospace');
    text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', color);
    text.textContent = textContent; svg.appendChild(text);
  }

  function exportTxt() {
    const plist = Array.isArray(STATUS_DATA.projects) && STATUS_DATA.projects.length ? STATUS_DATA.projects : DEFAULT_PROJECTS;
    if (plist.length === 0) { alert('登録されている作品がありません。'); return; }

    const allDataMap = {};
    const allDatesSet = new Set();
    plist.forEach(p => {
      const data = Array.isArray(p.data) ? p.data : [];
      allDataMap[p.id] = {};
      data.forEach(record => {
        allDataMap[p.id][record.date] = record;
        allDatesSet.add(record.date);
      });
    });

    const allDates = Array.from(allDatesSet).sort();

    const blocks = plist.map(p => {
      let lines = [p.name || ('作品 ' + p.id)];
      allDates.forEach(date => {
        const record = allDataMap[p.id][date];
        if (record) {
          lines.push(String(record.views));
          lines.push(String(record.loves));
          lines.push(String(record.favorites));
        } else {
          lines.push('');
          lines.push('');
          lines.push('');
        }
      });
      return lines.join('\n');
    });

    const output = blocks.join('\n\n');
    const blob = new Blob([output], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'scratch_stats.txt';
    a.click();
  }
</script>
</body>
</html>
