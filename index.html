<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scratch Tracker</title>
  <link rel="icon" href="ICON.png">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 1rem; background: #f5f6fa; margin: 0; }
    .container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { margin: 0 0 8px 0; font-size: 1.25rem; }
    .muted { color: #666; font-size: 0.95rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #e6e9ee; padding: 8px 10px; text-align: left; vertical-align: middle; }
    th { background: #f7f8fb; font-weight: 600; }
    .center { text-align: center; }
    .error { color: #b00020; }
    button { background: #3498db; color: white; border: none; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { background: #2980b9; }
    .small { font-size: 0.9rem; }
    @media (max-width: 640px) {
      .container { padding: 12px; }
      th, td { font-size: 13px; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Projects status</h1>
    <div class="muted" id="updated">最終更新: 読み込み中…</div>
    <div style="margin-top:10px; display:flex; gap:8px; align-items:center;">
      <button id="refresh">再読み込み</button>
      <div class="small muted">(status.json の内容を表示します)</div>
    </div>

    <div id="root" style="margin-top:12px;">
      <p class="muted">読み込み中…</p>
    </div>
  </div>

  <script>
    async function loadStatus() {
      const root = document.getElementById('root');
      const updatedEl = document.getElementById('updated');
      root.innerHTML = '<p class="muted">読み込み中…</p>';
      updatedEl.textContent = '最終更新: 読み込み中…';

      try {
        const res = await fetch('/status.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const status = await res.json();

        updatedEl.textContent = status.update ? ('最終更新: ' + new Date(status.update).toLocaleString()) : '最終更新: -';

        const projects = Array.isArray(status.projects) ? status.projects : [];
        if (projects.length === 0) {
          root.innerHTML = '<p class="muted">プロジェクトはありません。</p>';
          return;
        }

        // Build table showing latest record for each project
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = '<tr><th>プロジェクト名</th><th>ID</th><th>日付</th><th class="center">views</th><th class="center">loves</th><th class="center">favorites</th></tr>';
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        for (const p of projects) {
          const latest = (Array.isArray(p.data) && p.data.length) ? p.data[p.data.length - 1] : null;
          const tr = document.createElement('tr');

          const nameTd = document.createElement('td');
          nameTd.textContent = p.name || '';
          tr.appendChild(nameTd);

          const idTd = document.createElement('td');
          idTd.textContent = p.id ?? '';
          tr.appendChild(idTd);

          const dateTd = document.createElement('td');
          dateTd.textContent = latest ? latest.date : '-';
          tr.appendChild(dateTd);

          const viewsTd = document.createElement('td');
          viewsTd.className = 'center';
          viewsTd.textContent = latest ? latest.views : '-';
          tr.appendChild(viewsTd);

          const lovesTd = document.createElement('td');
          lovesTd.className = 'center';
          lovesTd.textContent = latest ? latest.loves : '-';
          tr.appendChild(lovesTd);

          const favTd = document.createElement('td');
          favTd.className = 'center';
          favTd.textContent = latest ? latest.favorites : '-';
          tr.appendChild(favTd);

          tbody.appendChild(tr);
        }

        table.appendChild(tbody);
        root.innerHTML = '';
        root.appendChild(table);

      } catch (err) {
        root.innerHTML = '<p class="error">読み込みに失敗しました: ' + (err.message || err) + '</p>';
        console.error(err);
      }
    }

    document.getElementById('refresh').addEventListener('click', loadStatus);
    loadStatus();
  </script>
</body>
</html>
